name: mediawall

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mediawall
      POSTGRES_USER: mediawall
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run start.ps1 or copy .env.example to .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediawall -d mediawall"]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_NAME: MediaWall
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:?Run start.ps1 or copy .env.example to .env}
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: mediawall
      DB_USERNAME: mediawall
      DB_PASSWORD: ${DB_PASSWORD:?Run start.ps1 or copy .env.example to .env}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: public
      LOG_CHANNEL: stderr
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads_data:/var/www/html/storage/app/public
      - ./backend/app/Http/Controllers/MediaController.php:/var/www/html/app/Http/Controllers/MediaController.php:ro
      - ./backend/routes/api.php:/var/www/html/routes/api.php:ro
      - ./backend/database/migrations/2026_09_20_000001_create_media_table.php:/var/www/html/database/migrations/2026_09_20_000001_create_media_table.php:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
  frontend_node_modules:
  frontend_next:
